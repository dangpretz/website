<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wholesale Counts | Dangerous Pretzel Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Paytone+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: 'Manrope', sans-serif; color: #1A1A1A; background: #1A1A1A; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }

    .site-nav { background: #1A1A1A; padding: 14px 5%; position: sticky; top: 0; z-index: 9999; border-bottom: 1px solid #333; }
    .nav-wrap { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { height: 46px; }
    .nav-links { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .nav-links a { color: #fff; font: 400 15px/1 'Manrope', sans-serif; transition: color 0.2s; }
    .nav-links a:hover { color: #C41E1E; }

    .hero { background: #1A1A1A; text-align: center; padding: clamp(30px, 4vw, 50px) 5% clamp(16px, 3vw, 28px); }
    .hero h1 { font: 900 italic clamp(32px, 5vw, 52px)/1.05 Georgia, serif; color: #fff; margin: 0; }
    .hero p { color: #888; font: 400 14px 'Manrope', sans-serif; margin-top: 10px; }

    .section-cream { background: #F5F0E8; padding: clamp(24px, 4vw, 48px) 5% 60px; min-height: 60vh; }
    .max-1100 { max-width: 1100px; margin: 0 auto; }

    /* ── Controls ── */
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .seg { display: inline-flex; border: 2px solid #ddd; border-radius: 8px; overflow: hidden; background: #fff; }
    .seg button { font: 700 14px 'Manrope', sans-serif; padding: 10px 22px; border: none; background: transparent; color: #888; cursor: pointer; transition: all 0.15s; }
    .seg button.active { background: #1A1A1A; color: #fff; }
    .seg button:not(.active):hover { color: #1A1A1A; }
    .nav-group { display: flex; align-items: center; gap: 8px; }
    .nav-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #1A1A1A; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .nav-btn:hover { background: #C41E1E; }
    .today-btn { height: 44px; padding: 0 18px; border-radius: 22px; border: 2px solid #1A1A1A; background: transparent; color: #1A1A1A; font: 700 13px 'Manrope', sans-serif; cursor: pointer; transition: all 0.15s; }
    .today-btn:hover { background: #1A1A1A; color: #fff; }
    .range-label { text-align: center; flex: 1; min-width: 180px; }
    .range-label .main { font: 800 clamp(20px, 3vw, 26px) 'Manrope', sans-serif; color: #1A1A1A; }
    .range-label .sub { font: 600 12px 'Manrope', sans-serif; color: #888; margin-top: 2px; letter-spacing: 0.4px; }
    .btn-refresh { background: transparent; border: 2px solid #ccc; color: #888; font: 700 12px 'Manrope', sans-serif; border-radius: 6px; padding: 7px 14px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-refresh:hover:not(:disabled) { border-color: #C41E1E; color: #C41E1E; }
    .btn-refresh:disabled { opacity: 0.45; cursor: not-allowed; }

    .status { text-align: center; padding: 48px 20px; font: 400 14px 'Manrope', sans-serif; color: #888; }
    .status.error { color: #C41E1E; font-weight: 700; }

    /* ── Headline totals ── */
    .summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat { background: #fff; border-radius: 10px; padding: 16px 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); flex: 1; min-width: 140px; }
    .stat .n { font: 800 32px 'Manrope', sans-serif; color: #1A1A1A; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat .l { font: 700 10px 'Manrope', sans-serif; color: #999; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 4px; }
    .stat .s { font: 400 12px 'Manrope', sans-serif; color: #999; margin-top: 2px; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); background: #fff; }
    table.counts { width: 100%; border-collapse: collapse; background: #fff; }
    table.counts th, table.counts td { padding: 13px 16px; border-bottom: 1px solid #f2efe9; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: middle; }
    table.counts th { font: 700 10px 'Manrope', sans-serif; color: #999; letter-spacing: 0.7px; text-transform: uppercase; border-bottom: 2px solid #ece7df; }
    table.counts th.sku-col, table.counts td.sku-col { text-align: left; position: sticky; left: 0; background: #fff; font: 700 15px 'Manrope', sans-serif; color: #1A1A1A; }
    table.counts th.sku-col { font: 700 10px 'Manrope', sans-serif; color: #999; z-index: 1; }
    table.counts .big { font: 800 20px 'Manrope', sans-serif; color: #1A1A1A; }
    table.counts .unit { font: 600 11px 'Manrope', sans-serif; color: #999; margin-left: 4px; }
    table.counts .note { display: block; font: 400 11px 'Manrope', sans-serif; color: #999; margin-top: 1px; }
    table.counts .zero { color: #d5d0c8; }
    table.counts tr.group-row td { background: #1A1A1A; color: #fff; font: 700 10px 'Manrope', sans-serif; letter-spacing: 1px; text-transform: uppercase; text-align: left; padding: 8px 16px; }
    table.counts tr.total-row td { border-top: 2px solid #1A1A1A; border-bottom: none; background: #faf8f4; font-weight: 800; }
    table.counts tr.total-row td.sku-col { background: #faf8f4; }
    table.counts td.total-col, table.counts th.total-col { border-left: 2px solid #ece7df; background: #faf8f4; }
    table.counts th.day-head { cursor: pointer; }
    table.counts th.day-head:hover { color: #C41E1E; }
    table.counts th.day-head .dnum { display: block; font: 800 16px 'Manrope', sans-serif; color: #1A1A1A; letter-spacing: 0; margin-top: 2px; }
    table.counts th.is-today { color: #C41E1E; }
    table.counts td.is-today { background: #fff6f6; }
    table.counts td.cell { font: 700 14px 'Manrope', sans-serif; }
    table.counts td.cell .pz { display: block; font: 400 11px 'Manrope', sans-serif; color: #999; margin-top: 1px; }

    .empty { text-align: center; padding: 56px 20px; font: 600 15px 'Manrope', sans-serif; color: #999; background: #fff; border-radius: 10px; }
    .footnote { margin-top: 14px; font: 400 12px/1.5 'Manrope', sans-serif; color: #999; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font: 600 12px 'Manrope', sans-serif; color: #888; }

    @media (max-width: 680px) {
      .seg button { padding: 10px 16px; }
      table.counts th, table.counts td { padding: 11px 10px; }
      table.counts td.sku-col { font-size: 13px; }
      table.counts .big { font-size: 17px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <div class="nav-wrap">
      <a href="../v2/index.html"><img src="https://www.dangerouspretzel.com/images/logos/svg-logo.svg" alt="Dangerous Pretzel Co." class="nav-logo"></a>
      <div class="nav-links">
        <a href="../index.html">&larr; Staff Hub</a>
      </div>
    </div>
  </nav>

  <section class="hero">
    <h1>WHOLESALE COUNTS.</h1>
    <p>Cases and pretzels needed for wholesale deliveries.</p>
  </section>

  <div class="section-cream">
    <div class="max-1100">

      <div class="controls">
        <div class="seg" id="mode-seg">
          <button data-mode="day" class="active">Day</button>
          <button data-mode="week">Week</button>
        </div>
        <div class="nav-group">
          <button class="nav-btn" id="prev-btn" aria-label="Previous">&#8249;</button>
          <button class="today-btn" id="today-btn">Today</button>
          <button class="nav-btn" id="next-btn" aria-label="Next">&#8250;</button>
        </div>
        <div class="range-label">
          <div class="main" id="range-main"></div>
          <div class="sub" id="range-sub"></div>
        </div>
        <button class="btn-refresh" id="refresh-btn">&#8635; Refresh</button>
      </div>

      <div id="status" class="status">Loading deliveries…</div>
      <div id="summary" class="summary" hidden></div>
      <div id="content" hidden></div>
      <p id="footnote" class="footnote" hidden></p>

    </div>
  </div>

  <script type="module">
    import { fetchLog } from '../../scripts/sheet-logger.js';
    import { requireAccess } from '../../scripts/staff-access.js';
    import {
      resolveDeliveries, resolveProductionLogs, CASE_SIZES, LEGACY_SKU_RENAMES,
    } from '../../scripts/inventory.js';

    const DELIVERY_LOG = '/dangpretz/delivery-planner';
    const PRODUCTION_LOG = '/dangpretz/production';
    const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    let mode = 'day';          // 'day' | 'week'
    let anchor = new Date();   // the day shown (day mode) or any day in the week shown (week mode)
    let rows = [];             // flattened wholesale line items: { date, sku, qty, cases, loose }
    let deliveryCountByDate = {};

    const $ = (id) => document.getElementById(id);

    // ── date helpers (local calendar, noon-anchored so DST can't shift a day) ──
    const pad = (n) => String(n).padStart(2, '0');
    const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parse = (s) => new Date(`${s}T12:00:00`);
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const weekStart = (d) => addDays(d, -((d.getDay() + 6) % 7)); // Monday
    const fmtLong = (d) => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    const fmtShort = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const num = (n) => Number(n).toLocaleString('en-US');
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Which table group a SKU belongs in. Pretzels are what the team shapes
    // and bakes; dips and catering boxes are counted in units only.
    function groupOf(sku) {
      const s = sku.toLowerCase();
      if (/^catering:/.test(s)) return 'other';
      if (s.includes('dip')) return 'dips';
      return 'pretzels';
    }
    const GROUP_LABEL = { pretzels: 'Pretzels', dips: 'Dips', other: 'Catering boxes & other' };
    const GROUP_ORDER = ['pretzels', 'dips', 'other'];

    // Pretzel-size ordering so the list reads the same every day: biggest
    // first (21oz, 10oz, 7oz, 4oz), then name.
    function skuSortKey(sku) {
      const m = sku.match(/^(\d+(?:\.\d+)?)oz/i);
      return [m ? -parseFloat(m[1]) : 1, sku.toLowerCase()];
    }
    function bySku(a, b) {
      const [an, as] = skuSortKey(a); const [bn, bs] = skuSortKey(b);
      return an - bn || as.localeCompare(bs);
    }

    // ── Data ──
    async function load() {
      $('status').hidden = false;
      $('status').classList.remove('error');
      $('status').textContent = 'Loading deliveries…';
      $('refresh-btn').disabled = true;
      try {
        const [dLogs, pLogs] = await Promise.all([
          fetchLog(DELIVERY_LOG),
          fetchLog(PRODUCTION_LOG).catch(() => []), // only used for SKU aliases
        ]);
        const aliases = { ...LEGACY_SKU_RENAMES, ...resolveProductionLogs(pLogs).skuAliases };
        const canon = (raw) => { const k = String(raw || '').trim(); return aliases[k] || k; };

        rows = [];
        deliveryCountByDate = {};
        resolveDeliveries(dLogs)
          .filter((d) => !d._deleted && (d.orderCategory || 'wholesale') === 'wholesale' && d.date)
          .forEach((d) => {
            let items = [];
            try { items = JSON.parse(d.lineItems || '[]'); } catch (_) { return; }
            if (!Array.isArray(items)) return;
            let counted = false;
            items.forEach((it) => {
              const sku = canon(it.sku);
              const qty = Number(it.quantity) || 0;
              if (!sku || qty <= 0) return;
              counted = true;
              // Cases: use what the order recorded; otherwise fall back to the
              // SKU's standard case size and report any remainder as loose.
              let cases = 0; let loose = qty;
              const cs = Number(it.caseSize) || 0; const cc = Number(it.caseCount) || 0;
              if (cs > 0 && cc > 0) {
                cases = cc; loose = Math.max(0, qty - cc * cs);
              } else if (CASE_SIZES[sku] > 0) {
                cases = Math.floor(qty / CASE_SIZES[sku]); loose = qty - cases * CASE_SIZES[sku];
              }
              rows.push({ date: d.date, sku, qty, cases, loose, caseSize: cs > 0 && cc > 0 ? cs : (CASE_SIZES[sku] || 0) });
            });
            if (counted) deliveryCountByDate[d.date] = (deliveryCountByDate[d.date] || 0) + 1;
          });
        $('status').hidden = true;
        render();
      } catch (err) {
        $('status').classList.add('error');
        $('status').textContent = `Couldn't load deliveries: ${err.message}`;
        $('summary').hidden = true; $('content').hidden = true; $('footnote').hidden = true;
      } finally {
        $('refresh-btn').disabled = false;
      }
    }

    // Sum rows for the given dates → { sku: { qty, cases, loose } }
    function totalsFor(dates) {
      const set = new Set(dates);
      const out = {};
      rows.forEach((r) => {
        if (!set.has(r.date)) return;
        const t = out[r.sku] || (out[r.sku] = { qty: 0, cases: 0, loose: 0, sizes: {} });
        t.qty += r.qty; t.cases += r.cases; t.loose += r.loose;
        if (r.cases > 0 && r.caseSize) t.sizes[r.caseSize] = (t.sizes[r.caseSize] || 0) + r.cases;
      });
      return out;
    }

    // "3 cases" cell content; notes the case-size mix and leftover loose units
    function casesHtml(t) {
      if (!t || (t.cases === 0 && t.loose === 0)) return '<span class="zero">—</span>';
      const parts = [];
      if (t.cases > 0) parts.push(`<span class="big">${num(t.cases)}</span><span class="unit">${t.cases === 1 ? 'case' : 'cases'}</span>`);
      const sizes = Object.entries(t.sizes);
      const notes = [];
      if (sizes.length > 1) notes.push(sizes.map(([s, c]) => `${c}×${s}`).join(' + '));
      if (t.loose > 0) notes.push(`${t.cases > 0 ? '+ ' : ''}${num(t.loose)} loose`);
      return parts.join('') + (notes.length ? `<span class="note">${notes.join(' · ')}</span>` : '');
    }

    function sumGroup(totals, group) {
      return Object.entries(totals).filter(([sku]) => groupOf(sku) === group)
        .reduce((a, [, t]) => ({ qty: a.qty + t.qty, cases: a.cases + t.cases }), { qty: 0, cases: 0 });
    }

    // ── Render ──
    function render() {
      const days = mode === 'day' ? [anchor] : Array.from({ length: 7 }, (_, i) => addDays(weekStart(anchor), i));
      const dateStrs = days.map(ymd);
      const todayStr = ymd(new Date());

      // header label
      if (mode === 'day') {
        $('range-main').textContent = fmtLong(anchor);
        $('range-sub').textContent = ymd(anchor) === todayStr ? 'TODAY' : '';
      } else {
        const ws = weekStart(anchor); const we = addDays(ws, 6);
        $('range-main').textContent = `${fmtShort(ws)} – ${fmtShort(we)}`;
        $('range-sub').textContent = dateStrs.includes(todayStr) ? 'THIS WEEK' : `WEEK OF ${fmtShort(ws).toUpperCase()}`;
      }

      const totals = totalsFor(dateStrs);
      const skus = Object.keys(totals);
      const deliveries = dateStrs.reduce((s, d) => s + (deliveryCountByDate[d] || 0), 0);

      if (!skus.length) {
        $('summary').hidden = true; $('footnote').hidden = true;
        $('content').hidden = false;
        $('content').innerHTML = `<div class="empty">No wholesale deliveries ${mode === 'day' ? 'on this day' : 'this week'}.</div>`;
        return;
      }

      // headline numbers — pretzels only (that's what the team is making)
      const pz = sumGroup(totals, 'pretzels');
      const dips = sumGroup(totals, 'dips');
      $('summary').hidden = false;
      $('summary').innerHTML = `
        <div class="stat"><div class="n">${num(pz.cases)}</div><div class="l">Pretzel cases</div></div>
        <div class="stat"><div class="n">${num(pz.qty)}</div><div class="l">Pretzels needed</div></div>
        <div class="stat"><div class="n">${num(deliveries)}</div><div class="l">${deliveries === 1 ? 'Delivery' : 'Deliveries'}</div>${dips.qty ? `<div class="s">+ ${num(dips.qty)} dips</div>` : ''}</div>`;

      $('content').hidden = false;
      $('content').innerHTML = mode === 'day' ? dayTable(totals) : weekTable(days, dateStrs, todayStr);
      $('content').querySelectorAll('[data-jump]').forEach((th) => {
        th.addEventListener('click', () => { anchor = parse(th.dataset.jump); mode = 'day'; syncMode(); render(); });
      });

      $('footnote').hidden = false;
      $('footnote').textContent = 'Cases come from what each order recorded; where an order only listed a quantity, the standard case size is used and any remainder shows as loose. Includes scheduled and already-delivered wholesale orders.';
    }

    function groupedSkus(skus) {
      return GROUP_ORDER.map((g) => [g, skus.filter((s) => groupOf(s) === g).sort(bySku)]).filter(([, l]) => l.length);
    }

    function dayTable(totals) {
      const groups = groupedSkus(Object.keys(totals));
      let body = '';
      groups.forEach(([g, list]) => {
        body += `<tr class="group-row"><td colspan="3">${GROUP_LABEL[g]}</td></tr>`;
        list.forEach((sku) => {
          const t = totals[sku];
          const showCases = g === 'pretzels';
          body += `<tr><td class="sku-col">${esc(sku)}</td>
            <td>${showCases ? casesHtml(t) : '<span class="zero">—</span>'}</td>
            <td><span class="big">${num(t.qty)}</span><span class="unit">${g === 'dips' ? 'dips' : (g === 'other' ? '' : 'pretzels')}</span></td></tr>`;
        });
      });
      const pz = sumGroup(totals, 'pretzels');
      body += `<tr class="total-row"><td class="sku-col">Pretzel total</td><td><span class="big">${num(pz.cases)}</span><span class="unit">cases</span></td><td><span class="big">${num(pz.qty)}</span><span class="unit">pretzels</span></td></tr>`;
      return `<div class="table-wrap"><table class="counts">
        <thead><tr><th class="sku-col">Item</th><th>Cases</th><th>Pretzels needed</th></tr></thead>
        <tbody>${body}</tbody></table></div>`;
    }

    function weekTable(days, dateStrs, todayStr) {
      const perDay = dateStrs.map((d) => totalsFor([d]));
      const weekTotals = totalsFor(dateStrs);
      const groups = groupedSkus(Object.keys(weekTotals));
      const head = days.map((d, i) => `<th class="day-head${dateStrs[i] === todayStr ? ' is-today' : ''}" data-jump="${dateStrs[i]}" title="Open this day">${DAY_NAMES[d.getDay()]}<span class="dnum">${d.getDate()}</span></th>`).join('');
      const cell = (t, g) => {
        if (!t) return '<span class="zero">—</span>';
        const top = g === 'pretzels' && t.cases > 0 ? `${num(t.cases)} cs` : num(t.qty);
        const sub = g === 'pretzels' && t.cases > 0 ? num(t.qty) : '';
        return `${top}${sub ? `<span class="pz">${sub}</span>` : ''}`;
      };
      let body = '';
      groups.forEach(([g, list]) => {
        body += `<tr class="group-row"><td colspan="${days.length + 2}">${GROUP_LABEL[g]}</td></tr>`;
        list.forEach((sku) => {
          const cells = perDay.map((t, i) => `<td class="cell${dateStrs[i] === todayStr ? ' is-today' : ''}">${cell(t[sku], g)}</td>`).join('');
          const wt = weekTotals[sku];
          const totalCell = g === 'pretzels' && wt.cases > 0
            ? `<span class="big">${num(wt.cases)}</span><span class="unit">cases</span><span class="note">${num(wt.qty)} pretzels</span>`
            : `<span class="big">${num(wt.qty)}</span>`;
          body += `<tr><td class="sku-col">${esc(sku)}</td>${cells}<td class="total-col">${totalCell}</td></tr>`;
        });
      });
      const pzDay = perDay.map((t, i) => { const s = sumGroup(t, 'pretzels'); return `<td class="cell${dateStrs[i] === todayStr ? ' is-today' : ''}">${s.qty ? `${num(s.cases)} cs<span class="pz">${num(s.qty)}</span>` : '<span class="zero">—</span>'}</td>`; }).join('');
      const pzWeek = sumGroup(weekTotals, 'pretzels');
      body += `<tr class="total-row"><td class="sku-col">Pretzel total</td>${pzDay}<td class="total-col"><span class="big">${num(pzWeek.cases)}</span><span class="unit">cases</span><span class="note">${num(pzWeek.qty)} pretzels</span></td></tr>`;
      return `<div class="legend"><span>Each day: cases on top, total pretzels underneath</span></div>
        <div class="table-wrap"><table class="counts">
        <thead><tr><th class="sku-col">Item</th>${head}<th class="total-col">Week</th></tr></thead>
        <tbody>${body}</tbody></table></div>`;
    }

    // ── Controls ──
    function syncMode() {
      [...$('mode-seg').children].forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
    }
    function step(dir) { anchor = addDays(anchor, dir * (mode === 'day' ? 1 : 7)); render(); }

    $('mode-seg').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      mode = b.dataset.mode; syncMode(); render();
    });
    $('prev-btn').addEventListener('click', () => step(-1));
    $('next-btn').addEventListener('click', () => step(1));
    $('today-btn').addEventListener('click', () => { anchor = new Date(); render(); });
    $('refresh-btn').addEventListener('click', load);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });
    // Keep a long-open tab current: refetch when it regains focus.
    document.addEventListener('visibilitychange', () => { if (!document.hidden && rows.length) load(); });

    (async () => {
      await requireAccess('wholesale-counts');
      await load();
    })();
  </script>
