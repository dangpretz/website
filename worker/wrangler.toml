name = "dpc-catering-checkout"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "f399e3bcd5ea1501830d0ad1d35d9da3"

# Retain ~24h of console.* output + HTTP request metadata so we can
# diagnose post-hoc when a checkout fails. View in Cloudflare dashboard
# under the worker's "Logs" tab, or via `wrangler tail`.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
SQUARE_LOCATION_ID = "LEJ3PDZ9V6NYN"
SQUARE_ENV = "production"
# From-address for FOH calendar invites. Domain must be verified at
# resend.com/domains; until then sends fail with 403 (no harm — KV stays
# empty and cron retries every 30min). Change the local-part if you want
# a different display name (it just appears as ORGANIZER in the invite).
FOH_CAL_FROM = "DPC Production Schedule <noreply@dangerouspretzel.com>"

# Tracks which calendar events we've already invited getdangerous@myecalendar.com
# to. Each VEVENT UID -> { sequence, contentHash, summary, status }. Without
# this, the cron would re-send invites every run.
[[kv_namespaces]]
binding = "FOH_CAL_STATE"
id = "3f111dbe5ac44c7e9b168f8049754b22"

# Service binding to pretzel-os — required for inter-worker calls on the same
# Cloudflare account (public-URL fetch returns CF error 1042). Used by the
# catering reactivation promo-token validation flow.
[[services]]
binding = "PRETZEL_OS"
service = "pretzel-os"

# Cron — nightly at 09:20 UTC (~03:20 America/Denver, after close). Runs
# `scheduled()` → runNightlySync: snapshots the prior day's Square FOH sales to
# /dangpretz/foh-sales + a retail-only `foh_sale` drawdown row to
# /dangpretz/production, then runs the catering→planner catch-up.
# (The old myecalendar iCal-invite cron was abandoned 2026-05-06.)
[triggers]
crons = ["20 9 * * *"]
